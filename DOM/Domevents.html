<button id="btn">Click Me</button>
<p id="text">Before Click</p>

<script>
document.getElementById("btn").addEventListener("click", () => {
  document.getElementById("text").innerText = "After Click";
});
</script>

<script>
  document.getElementById("btn").addEventListener("click",()=>{
    document.getElementById("text").innerText= "After Click";
  });
</script>

<!-- 
The code adds a click event listener to a button using addEventListener().
When the button is clicked, JavaScript updates the paragraph’s text from “Before Click” to “After Click” using innerText.
This demonstrates DOM manipulation and event handling — changing webpage content dynamically without reloading. -->
